<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>企業検索 | 企業情報管理システム</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="background"></div>

<header class="top-header">

    <div class="header-title">

        🏢 企業情報管理システム

    </div>

    <div class="header-user">

        ログインユーザー：admin

    </div>

</header>

<main class="search-page">

    <section class="search-card">

        <h2>

            企業検索

        </h2>

        <p class="search-description">

            企業コードを入力し、
            検索ボタンを押してください。

        </p>

        <div class="search-area">

            <div>

                <label for="txtCompanyCode">

                    企業コード

                </label>

                <input
                    type="text"
                    id="txtCompanyCode"
                    placeholder="例：100004"
                    maxlength="6">

            </div>

            <button
                id="btnSearch">

                検索

            </button>

        </div>

    </section>

    <section class="result-card">

        <div class="result-header">

            <h2>

                検索結果

            </h2>

            <div
                id="lblResultCount"
                class="result-count">

                検索してください。

            </div>

        </div>

        <div
            id="divLoading"
            class="loading-area"
            style="display:none;">

            検索中...

        </div>

        <div
            id="divMessage"
            class="message-area">

        </div>

        <table id="tblResult">

            <thead>

                <tr>

                    <th>企業コード</th>
                    <th>企業名</th>
                    <th>文書番号</th>
                    <th>文書名</th>
                    <th>公開状態</th>
                    <th>公開日</th>
                    <th>PDF</th>

                </tr>

            </thead>

            <tbody id="tbodyResult">
                   

            </tbody>

        </table>

    </section>

</main>

<script src="js/search.js"></script>

</body>

</html>
