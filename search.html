<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>企業検索 | 企業情報管理システム</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="background"></div>

<header class="top-header">

    <div class="header-title">

        🏢 企業情報管理システム

    </div>

    <div class="header-user">

        ログインユーザー：admin

    </div>

</header>


<main class="search-page">

    <section class="search-card">

        <h2>

            企業検索

        </h2>

        <p class="search-description">

            企業コードを入力し、検索ボタンを押してください。

        </p>

        <div class="search-area">

            <label for="txtCompanyCode">

                企業コード

            </label>

            <input
                type="text"
                id="txtCompanyCode"
                placeholder="例：100001">

            <button
                id="btnSearch">

                検索

            </button>

        </div>

    </section>



    <section class="result-card">

        <h2>

            検索結果

        </h2>

        <table id="tblResult">

            <thead>

            <tr>

                <th>企業コード</th>
                <th>企業名</th>
                <th>公開状態</th>
                <th>公開日</th>
                <th>PDF</th>

            </tr>

            </thead>

            <tbody>

            <tr>

                <td colspan="5">

                    検索してください。

                </td>

            </tr>

            </tbody>

        </table>

    </section>

</main>

</body>

</html>
