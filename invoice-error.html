<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ログインエラー | 請求書受領管理システム</title>

    <link rel="stylesheet"
          href="css/invoice-style.css">

</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <!-- システム情報 -->
            <div class="system-area">

                <div class="system-icon">
                    📄
                </div>

                <h1>
                    請求書受領管理システム
                </h1>

                <p class="system-name">
                    Invoice Receipt Management System
                </p>

                <p class="system-description">
                    受領した請求書の検索・確認を行うための業務システムです。
                </p>

            </div>


            <!-- エラー表示 -->
            <div class="login-area">

                <div class="login-header">

                    <h2>
                        ログインエラー
                    </h2>

                    <p id="lblErrorMessage">
                        ログインに失敗しました。
                    </p>

                </div>


                <button
                    id="btnBack"
                    class="login-button"
                    type="button"
                    onclick="location.href='invoice-login.html'">

                    ログイン画面へ戻る

                </button>


                <div class="system-info">

                    <div>
                        Version 1.0
                    </div>

                    <div>
                        PAD Training Environment
                    </div>

                </div>

            </div>

        </section>

    </main>


    <script>

    const errorMessage =
        document.getElementById("lblErrorMessage");

    const message =
        sessionStorage.getItem("loginError");


    if (message) {

        errorMessage.textContent = message;

        // 使用後は削除
        sessionStorage.removeItem("loginError");

    }
    else {

        errorMessage.textContent =
            "ログインに失敗しました。入力内容を確認してください。";

    }

</script>

</body>

</html>
